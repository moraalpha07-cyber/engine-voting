name: Feed Masking Firebase Every 5 Seconds

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  feed:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check if another run is active
        id: check_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTIVE_RUNS=$(gh run list --workflow masking-firebase.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId < ${{ github.run_id }})] | length" 2>/dev/null || echo 0)
          if [ "${ACTIVE_RUNS:-0}" -gt 0 ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⚠️ Another run is already active. Skipping this run."
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_run.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check_run.outputs.should_run == 'true'
        run: npm install

      - name: Run feeder
        if: steps.check_run.outputs.should_run == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GRAFANA_SESSION_ID: ${{ secrets.GRAFANA_SESSION_ID }}
          GRAFANA_USERNAME: ${{ secrets.GRAFANA_USERNAME }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          GRAFANA_URL: https://monitor-public.trax-cloud.com/api/datasources/proxy/29/render
          GRAFANA_LOGIN_URL: https://monitor-public.trax-cloud.com/login
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENFORCE_ACTIVE_HOURS: "true"
        run: npm run start-masking
