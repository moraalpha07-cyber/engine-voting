name: Feed Masking Firebase Every 5 Seconds

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  feed:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check if another run is active
        id: check_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTIVE_RUNS=$(gh run list --workflow "Feed Masking Firebase Every 5 Seconds" --status in_progress --json databaseId --jq "[.[] | select(.databaseId < ${{ github.run_id }})] | length")
          if [ "$ACTIVE_RUNS" -gt 0 ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⚠️ Another run is already active. Skipping this run."
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_run.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.check_run.outputs.should_run == 'true'
        run: npm install

      - name: Run feeder
        if: steps.check_run.outputs.should_run == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GRAFANA_SESSION_ID: ${{ secrets.GRAFANA_SESSION_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run start-masking

      - name: Re-trigger this workflow
        if: steps.check_run.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run masking-firebase.yml --repo ${{ github.repository }}
